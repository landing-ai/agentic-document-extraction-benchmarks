<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluation Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ───── Reset & variables (shared with detailed_report.py) ───── */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #f8f7f4;
  --fg: #1c1917;
  --card: #ffffff;
  --border: #e7e5e4;
  --muted: #78716c;
  --muted-light: #a8a29e;
  --cream: #faf9f6;
  --emerald: #059669;
  --emerald-bg: #ecfdf5;
  --amber: #d97706;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --blue: #2563eb;
  --blue-bg: #eff6ff;
  --font-heading: 'Newsreader', Georgia, serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
  --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.07), 0 2px 4px -2px rgba(28, 25, 23, 0.05);
  --radius: 10px;
  --radius-sm: 6px;
}

html {
  font-size: 15px;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ───── Scrollbar ───── */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--cream);
}

::-webkit-scrollbar-thumb {
  background: var(--muted-light);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

/* ───── Layout ───── */
.report-container {
  max-width: 1340px;
  margin: 0 auto;
  padding: 32px 24px 64px;
}

/* ───── Header ───── */
.report-header {
  margin-bottom: 36px;
}

.report-header h1 {
  font-family: var(--font-heading);
  font-size: 2.2rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--fg);
  line-height: 1.2;
}

.report-header .subtitle {
  font-size: 0.9rem;
  color: var(--muted);
  margin-top: 6px;
}

/* ───── Summary cards ───── */
.summary-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}

.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s;
}

.summary-card:hover {
  box-shadow: var(--shadow-md);
}

.summary-card .label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 4px;
}

.summary-card .big-number {
  font-family: var(--font-heading);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.15;
}

/* ───── Section titles ───── */
.section-title {
  font-family: var(--font-heading);
  font-size: 1.35rem;
  font-weight: 600;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}

/* The metric selector governs every card below, so it sits with the heading
   that names them rather than repeating once per card. */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}

.section-header .metric-selector {
  width: auto;
  min-width: 240px;
  margin-bottom: 0;
  /* Primary control for every card below, not a per-card afterthought. */
  padding: 7px 10px;
  font-size: 0.95rem;
  font-weight: 500;
}

/* ───── Categories grid ───── */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.category-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s;
  cursor: pointer;
  display: block;
  color: inherit;
}

.category-card:hover {
  box-shadow: var(--shadow-md);
}

.category-card h3 {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--fg);
}

.category-card h3 .file-count {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--muted);
}

.category-card .main-score {
  font-family: var(--font-heading);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.15;
  margin-bottom: 8px;
}

.color-emerald {
  color: var(--emerald);
}

.color-amber {
  color: var(--amber);
}

.color-red {
  color: var(--red);
}

/* A split that does not report the selected metric: absent, not zero. */
.color-muted {
  color: var(--muted);
}

/* ───── Progress bar ───── */
.progress-bar-track {
  height: 6px;
  background: var(--cream);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 12px;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}

.bar-emerald {
  background: var(--emerald);
}

.bar-amber {
  background: var(--amber);
}

.bar-red {
  background: var(--red);
}

.bar-muted {
  background: var(--border);
}

/* ───── Metric selector dropdown ───── */
.metric-selector {
  width: 100%;
  margin-bottom: 10px;
  padding: 6px 8px;
  font-family: var(--font-body);
  font-size: 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--cream);
  color: var(--fg);
  cursor: pointer;
  outline: none;
  transition: border-color 0.15s;
}

.metric-selector:focus {
  border-color: var(--blue);
}

/* ───── Metric rows ───── */
.metric-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  font-size: 0.82rem;
  border-bottom: 1px solid var(--cream);
}

.metric-row:last-child {
  border-bottom: none;
}

.metric-row .metric-name {
  color: var(--muted);
  flex: 1;
  min-width: 0;
  line-height: 1.4;
}

.metric-row .metric-value {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 500;
  margin-left: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.metric-row.selected .metric-name {
  font-weight: 700;
  color: var(--fg);
}

/* Divider between the paper's three headline metrics and the secondary ones. */
.metric-divider {
  border-top: 1px solid var(--border);
  margin: 6px 0;
}

.sub-note {
  font-size: 0.7rem;
  color: var(--fg-muted, #888);
  margin-top: 2px;
}

/* Cost on a category card: per-page leads, run total sits under it. */
.cost-block {
  display: flex;
  flex-direction: column;
  font-family: var(--font-mono);
  line-height: 1.3;
  margin-top: 8px;
  padding-top: 6px;
}

.cost-page {
  font-size: 0.82rem;
  font-weight: 500;
  color: #6b6759;
}

.cost-unit {
  font-size: 0.68rem;
  font-weight: 400;
  color: #8a8577;
}

.cost-total {
  font-size: 0.66rem;
  color: #a5a094;
}

/* ───── Responsive ───── */
@media (max-width: 900px) {
  .summary-row {
    grid-template-columns: repeat(2, 1fr);
  }

  .categories-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .report-container {
    padding: 16px 12px 48px;
  }

  .summary-row {
    grid-template-columns: 1fr;
  }
}
/* ───── Metric Tooltips ───── */
.metric-hint {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  margin-left: 5px;
  flex-shrink: 0;
  cursor: help;
}

.metric-hint::before {
  content: '?';
  display: flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--muted-light);
  font-family: var(--font-body);
  font-size: 0.55rem;
  font-weight: 700;
  color: var(--muted-light);
  line-height: 1;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.metric-hint:hover::before {
  border-color: var(--muted);
  color: var(--card);
  background: var(--muted);
}

/* Tooltip popup — rendered as a singleton fixed-position element via JS */
#metric-tooltip {
  position: fixed;
  z-index: 10000;
  width: 280px;
  padding: 10px 13px;
  background: var(--fg, #1c1917);
  color: #f5f5f4;
  font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
  font-size: 0.85rem;
  font-weight: 400;
  line-height: 1.6;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(28, 25, 23, 0.18), 0 2px 6px rgba(28, 25, 23, 0.08);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
}

#metric-tooltip.visible {
  opacity: 1;
}

#metric-tooltip::after {
  content: '';
  position: absolute;
  border: 5px solid transparent;
}

#metric-tooltip.arrow-bottom::after {
  top: 100%;
  left: var(--arrow-left, 50%);
  transform: translateX(-50%);
  border-top-color: var(--fg, #1c1917);
}

#metric-tooltip.arrow-top::after {
  bottom: 100%;
  left: var(--arrow-left, 50%);
  transform: translateX(-50%);
  border-bottom-color: var(--fg, #1c1917);
}

</style>
</head>

</div>

<script>
(function () {
  function colorClass(rate) {
    if (rate >= 80) return 'emerald';
    if (rate >= 50) return 'amber';
    return 'red';
  }

  function pct(val, d) {
    d = d !== undefined ? d : 1;
    return val.toFixed(d) + '%';
  }

  // Cost formatters. Null means no priced document in the pool — show an em
  // dash rather than a misleading $0.00.
  function usd(v) {
    if (v == null) return '—';
    return v < 1 ? '$' + v.toFixed(4) : '$' + v.toFixed(2);
  }
  function cents(v) {
    if (v == null) return '—';
    return (v * 100).toFixed(2) + '¢';
  }

  function esc(s) {
    if (s == null) return '';
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  // ─── Metric tooltip system (fixed-position, never clipped) ───
var _tipEl = null;
var _tipHideTimer = null;
function _ensureTip() {
  if (_tipEl) return _tipEl;
  _tipEl = document.createElement('div');
  _tipEl.id = 'metric-tooltip';
  document.body.appendChild(_tipEl);
  return _tipEl;
}
function _getTooltipText(metricKey) {
  var tips = (typeof DATA !== 'undefined' && DATA.metricTooltips)
    ? DATA.metricTooltips
    : (typeof metricTooltips !== 'undefined' ? metricTooltips : {});
  var text = tips[metricKey] || '';
  if (!text) {
    if (metricKey.indexOf('field_accuracy_') === 0) {
      var field = metricKey.slice(15).replace(/_/g, ' ');
      text = 'JSON subset match accuracy for the \u201c' + field + '\u201d field.';
    } else if (metricKey.indexOf('rule_') === 0 && metricKey.lastIndexOf('_pass_rate') === metricKey.length - 10) {
      var ruleType = metricKey.slice(5, metricKey.length - 10).replace(/_/g, ' ');
      text = 'Fraction of \u201c' + ruleType + '\u201d rules that pass.';
    } else if (metricKey.indexOf('f1_') === 0) {
      var cls = metricKey.slice(3).replace(/_/g, ' ');
      text = 'F1 score for the \u201c' + cls + '\u201d layout class: 2\u00d7P\u00d7R/(P+R).';
    } else if (metricKey.indexOf('precision_') === 0) {
      var cls2 = metricKey.slice(10).replace(/_/g, ' ');
      text = 'Precision for the \u201c' + cls2 + '\u201d layout class: TP/(TP+FP).';
    } else if (metricKey.indexOf('recall_') === 0) {
      var cls3 = metricKey.slice(7).replace(/_/g, ' ');
      text = 'Recall for the \u201c' + cls3 + '\u201d layout class: TP/(TP+FN).';
    }
  }
  return text;
}
function _showTip(icon) {
  clearTimeout(_tipHideTimer);
  var key = icon.getAttribute('data-metric');
  var text = _getTooltipText(key);
  if (!text) return;
  var tip = _ensureTip();
  tip.textContent = text;
  // Reset: position offscreen to measure, remove classes
  tip.className = '';
  tip.style.cssText = 'position:fixed;display:block;visibility:hidden;top:-9999px;left:-9999px';
  // Measure after text is set
  var iconRect = icon.getBoundingClientRect();
  var tipW = tip.offsetWidth;
  var tipH = tip.offsetHeight;
  var gap = 8;
  // Default: above
  var top = iconRect.top - tipH - gap;
  var arrowDir = 'arrow-bottom';
  // If not enough room above, go below
  if (top < 4) {
    top = iconRect.bottom + gap;
    arrowDir = 'arrow-top';
  }
  // Horizontal: center on icon, but clamp to viewport
  var left = iconRect.left + iconRect.width / 2 - tipW / 2;
  var maxLeft = window.innerWidth - tipW - 8;
  if (left < 8) left = 8;
  if (left > maxLeft) left = maxLeft;
  // Arrow position relative to tooltip
  var arrowLeft = (iconRect.left + iconRect.width / 2 - left);
  arrowLeft = Math.max(12, Math.min(arrowLeft, tipW - 12));
  // Apply final position — clear inline styles so CSS classes take effect
  tip.style.cssText = '';
  tip.style.top = top + 'px';
  tip.style.left = left + 'px';
  tip.style.setProperty('--arrow-left', arrowLeft + 'px');
  tip.className = arrowDir + ' visible';
}
function _hideTip() {
  _tipHideTimer = setTimeout(function () {
    if (_tipEl) { _tipEl.className = ''; }
  }, 80);
}
// Attach listeners via event delegation (mouseover/mouseout bubble, mouseenter/mouseleave do NOT)
var _currentHint = null;
document.addEventListener('mouseover', function (e) {
  var icon = e.target.closest ? e.target.closest('.metric-hint') : null;
  if (icon && icon !== _currentHint) {
    _currentHint = icon;
    _showTip(icon);
  } else if (!icon && _currentHint) {
    _currentHint = null;
    _hideTip();
  }
});
document.addEventListener('mouseout', function (e) {
  if (!_currentHint) return;
  var related = e.relatedTarget;
  if (!related || !(related.closest && related.closest('.metric-hint') === _currentHint)) {
    _currentHint = null;
    _hideTip();
  }
});

function tooltipIcon(metricKey) {
  var text = _getTooltipText(metricKey);
  if (!text) return '';
  return '<span class="metric-hint" data-metric="' + esc(metricKey) + '"></span>';
}


  // Divider entry between the paper's headline metrics and the rest.
  var SEPARATOR = '__separator__';

  var selectedMetric = DATA.defaultMetric;

  var titleText = DATA.pipelineName

    : 'Evaluation Report';
  document.getElementById('report-title').textContent = titleText;
  document.getElementById('subtitle').textContent = 'Generated: ' + DATA.generatedAt;

  // ─── Helpers ───
  // null (not 0) when this split does not report the selected metric — a zero
  // would read as a real score and drag the average down with it.
  function getSelectedValue(cat) {
    for (var i = 0; i < cat.metrics.length; i++) {
      if (cat.metrics[i].name === selectedMetric) {
        var v = cat.metrics[i].value;
        return (v === null || v === undefined) ? null : v * 100;
      }
    }
    return null;
  }

  function computeAvgScore() {
    var sum = 0, count = 0;
    DATA.categories.forEach(function (cat) {
      var v = getSelectedValue(cat);
      if (v === null) return;
      sum += v;
      count++;
    });
    return count > 0 ? sum / count : null;
  }

  // ─── Render summary cards ───
  function renderSummary() {
    var sc = document.getElementById('summary-cards');
    sc.innerHTML = '';
    var avg = computeAvgScore();
    var hasAvg = avg !== null;
    var ac = hasAvg ? colorClass(avg) : 'muted';

    // Total Files card
    var d1 = document.createElement('div');
    d1.className = 'summary-card';
    d1.innerHTML = '<div class="label">TOTAL FILES</div><div class="big-number">' + DATA.totalFiles + '</div>';
    sc.appendChild(d1);

    // Failed card. These documents are scored zero rather than dropped, so the

    // separates "extracted badly" from "never returned an answer".
    var failed = DATA.totalFailed || 0;
    var dF = document.createElement('div');
    dF.className = 'summary-card';
    dF.innerHTML = '<div class="label">FAILED</div>'
      + '<div class="big-number color-' + (failed ? 'red' : 'emerald') + '">'
      + failed + ' / ' + DATA.totalFiles + '</div>'
      + '<div class="sub-note">'
      + (DATA.totalFiles ? pct(100 * failed / DATA.totalFiles) + ' of documents' : 'no documents')
      + '</div>';
    sc.appendChild(dF);

    // Avg Score card
    var d2 = document.createElement('div');
    d2.className = 'summary-card';
    d2.innerHTML = '<div class="label">AVG SCORE</div><div class="big-number color-' + ac + '">'
      + (hasAvg ? pct(avg) : '—') + '</div>';
    sc.appendChild(d2);

    // Cost cards. Both figures pool every document once across splits rather
    // than averaging the per-split means.
    var oc = DATA.overallCost || {};
    if (oc.hasCost) {
      var d3 = document.createElement('div');
      d3.className = 'summary-card';
      d3.innerHTML = '<div class="label">TOTAL COST</div><div class="big-number">' + usd(oc.totalUsd) + '</div>'
        + '<div class="sub-note">' + oc.documents + ' doc' + (oc.documents === 1 ? '' : 's') + '</div>';
      sc.appendChild(d3);

      var d4 = document.createElement('div');
      d4.className = 'summary-card';
      d4.innerHTML = '<div class="label">COST / PAGE</div>'
        + '<div class="big-number">' + cents(oc.meanPerPageUsd) + '</div>'
        + '<div class="sub-note">document-level mean</div>';
      sc.appendChild(d4);
    }
  }

  // ─── Render category cards ───
  function renderCategories() {
    var grid = document.getElementById('categories-grid');
    grid.innerHTML = '';
    // Set grid columns to match number of categories
    var numCats = DATA.categories.length;
    grid.style.gridTemplateColumns = 'repeat(' + numCats + ', 1fr)';

    DATA.categories.forEach(function (cat) {
      var card = document.createElement('div');
      card.className = 'category-card';

      var selMetric = selectedMetric;
      var mainVal = getSelectedValue(cat);
      var hasVal = mainVal !== null;
      var c = hasVal ? colorClass(mainVal) : 'muted';

      var html = '<h3>' + esc(cat.displayName) + ' <span class="file-count">(' + cat.files + ' files)</span></h3>';
      html += '<div class="main-score color-' + c + '">' + (hasVal ? pct(mainVal) : '—') + '</div>';
      html += '<div class="progress-bar-track"><div class="progress-bar-fill bar-' + c
        + '" style="width:' + (hasVal ? Math.min(mainVal, 100) : 0) + '%"></div></div>';

      // Metric list: selected metric first, then the rest in original order
      // (headline block, divider, everything else).
      var sorted = [];
      var rest = [];
      for (var j = 0; j < cat.metrics.length; j++) {
        if (cat.metrics[j].name === selMetric) {
          sorted.unshift(cat.metrics[j]);
        } else {
          rest.push(cat.metrics[j]);
        }
      }
      sorted = sorted.concat(rest);

      for (var k = 0; k < sorted.length; k++) {
        var sm = sorted[k];
        if (sm.name === SEPARATOR) {
          html += '<div class="metric-divider"></div>';
          continue;
        }
        var mc = colorClass(sm.value * 100);
        var selClass = sm.name === selMetric ? ' selected' : '';
        html += '<div class="metric-row' + selClass + '">';
        html += '<span class="metric-name">' + esc(sm.displayName) + '</span>' + tooltipIcon(sm.name);
        html += '<span class="metric-value color-' + mc + '">' + pct(sm.value * 100) + '</span>';
        html += '</div>';
      }

      // Per-split cost: per-page is the comparable figure so it leads, with the
      // split total beneath it as context.
      var cc = cat.cost || {};
      if (cc.hasCost) {
        html += '<div class="cost-block">';
        html += '<span class="cost-page">' + cents(cc.meanPerPageUsd)
          + '<span class="cost-unit"> / page</span></span>';
        html += '<span class="cost-total">' + usd(cc.totalUsd) + ' total</span>';
        html += '</div>';
      }

      card.innerHTML = html;

      // Click on card navigates to detailed report (but not when clicking dropdown)
      card.addEventListener('click', function (e) {
        if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
        if (e.target.closest && e.target.closest('.metric-hint')) return;
        window.location.href = cat.name + '/_evaluation_report_detailed.html';
      });

      grid.appendChild(card);
    });
  }

  // ─── The one metric selector, above the cards it governs ───
  function renderMetricSelector() {
    var select = document.getElementById('metric-select');
    if (!select) return;
    var html = '';
    var metrics = DATA.unifiedMetrics || [];
    for (var i = 0; i < metrics.length; i++) {
      var m = metrics[i];
      // SEPARATOR is a divider, rendered disabled so it can never be selected.
      if (m.name === SEPARATOR) {
        html += '<option disabled>──────────</option>';
        continue;
      }
      var selected = m.name === selectedMetric ? ' selected' : '';
      html += '<option value="' + esc(m.name) + '"' + selected + '>' + esc(m.displayName) + '</option>';
    }
    select.innerHTML = html;
    select.addEventListener('change', function (e) {
      selectedMetric = e.target.value;
      renderCategories();
      renderSummary();
    });
  }

  renderMetricSelector();
  renderSummary();
  renderCategories();
})();

</script>
</body>
</html>
